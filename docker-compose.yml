services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    ports: ["5000:5000"]
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/crewsync
      NODE_ENV: production
    depends_on: [mongo]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  mongo_data:
